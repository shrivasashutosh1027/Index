<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Choose Your Link</title>
  <style>
    body {
      background: linear-gradient(120deg, #89f7fe 0%, #66a6ff 100%);
      font-family: 'Segoe UI', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }

    .container {
      background: white;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
      padding: 40px;
      max-width: 400px;
      text-align: center;
    }

    .logo {
      width: 200px;
      height: 200px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 20px;
      border: 3px solid #000003;
    }


    h1 {
      color: #333;
      margin-bottom: 20px;
    }

    .link-button {
      display: block;
      margin: 15px 0;
      padding: 14px 20px;
      background-color: #6268db;
      color: white;
      border: none;
      border-radius: 8px;
      text-decoration: none;
      font-size: 16px;
      transition: background 0.3s ease;
    }

    .link-button:hover {
      background-color: #8b9ce9;
    }

    .footer {
      font-size: 12px;
      color: #777;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="ashu.jpg" alt="Profile Photo" class="logo" />
    <h1>Welcome! Choose a Link</h1>
    <a href="https://www.linkedin.com/in/ashutosh-shrivas-803923293/" class="link-button" target="_blank">
  <img src="image copy.png" alt="LinkedIn" style="width: 40px; height: 40px; border-radius: 80%; vertical-align: middle; margin-right: 0px;" />Linkedin
</a>

    <a href="https://github.com/shrivasashutosh1027" class="link-button" target="_blank">
   <img src="image.png" alt="LinkedIn" style="width: 30px; height: 30px; border-radius: 80%; vertical-align: middle; margin-right: 0px;" />
  Github </a>

</div>
</body>
</html>
